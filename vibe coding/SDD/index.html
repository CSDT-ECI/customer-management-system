<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Huella de Carbono</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    main {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
      text-align: center;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cfd6dd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #1f6feb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1859bc;
    }

    #resultado {
      margin-top: 18px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>Huella de Carbono</h1>

    <!-- Maquetado HTML -->
    <div class="field">
      <label for="kilometros">Kilómetros en auto</label>
      <input type="number" id="kilometros" />
    </div>

    <div class="field">
      <label for="horasVuelo">Horas de vuelo</label>
      <input type="number" id="horasVuelo" />
    </div>

    <div class="field">
      <label for="electricidad">Gasto en electricidad</label>
      <input type="number" id="electricidad" />
    </div>

    <button id="calcularBtn">Calcular</button>

    <p id="resultado"></p>
  </main>

  <script>
    // Lógica JavaScript
    const kilometrosInput = document.getElementById('kilometros');
    const horasVueloInput = document.getElementById('horasVuelo');
    const electricidadInput = document.getElementById('electricidad');
    const calcularBtn = document.getElementById('calcularBtn');
    const resultado = document.getElementById('resultado');

    calcularBtn.addEventListener('click', function () {
      const kilometros = kilometrosInput.value;
      const horasVuelo = horasVueloInput.value;
      const electricidad = electricidadInput.value;

      if (kilometros === '' || horasVuelo === '' || electricidad === '') {
        resultado.textContent = 'Todos los campos son obligatorios.';
        return;
      }

      const total =
        (Number(kilometros) + Number(horasVuelo) + Number(electricidad)) * 0.5;

      resultado.textContent = 'Total de Huella de Carbono en KG: ' + total;
    });
  </script>
</body>
</html>
