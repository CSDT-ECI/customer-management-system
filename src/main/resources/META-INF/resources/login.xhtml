<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<f:view contentType="text/html">
    <h:head>
        <f:facet name="first">
            <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
            <title>Login page</title>
        </f:facet>
    </h:head>

    <h:body>

        <table width="100%" cellpadding="0" cellspacing="0" border="0" align="center" class="outer_table">
            <tr>
                <td>
                    <table width="350" height="300" cellpadding="0" cellspacing="0" border="0" align="center">
                        <tr>
                            <td align="center">
                                <h:graphicImage value="/images/logo1.png" width="200" style="margin: 50px 0;"/>
                                <form method="POST" action="/cms/login" style="border: 1px solid #ccc; border-radius: 5px; padding: 20px; width: 350px;">
                                    <h3 style="background-color: #5B9BD5; color: white; padding: 10px; text-align: center;">Login</h3>
                                    <div style="padding: 10px;">
                                        <label for="username">Username:</label><br/>
                                        <input type="text" id="username" name="username" style="width: 100%; padding: 5px; margin: 5px 0;"/><br/>
                                        <label for="password">Password:</label><br/>
                                        <input type="password" id="password" name="password" style="width: 100%; padding: 5px; margin: 5px 0;"/><br/>
                                        <input type="submit" value="Login" style="padding: 8px 20px; margin-top: 10px; cursor: pointer;"/>
                                    </div>
                                </form>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>

    </h:body>

</f:view>
</html>
