<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Huella de Carbono</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    body.dark-mode {
      background: #222;
      color: #fff;
    }

    main {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    body.dark-mode main {
      background: #222;
      border-color: #fff;
      color: #fff;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 24px;
      text-align: center;
    }

    form {
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
      color: #1f2937;
    }

    body.dark-mode input {
      background: #222;
      color: #fff;
      border-color: #fff;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 700;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #resultado {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      background: #eff6ff;
      font-weight: 700;
      text-align: center;
      min-height: 24px;
    }

    body.dark-mode #resultado {
      background: #222;
      color: #fff;
      border: 1px solid #fff;
    }

    .error {
      color: #7f1d1d;
      background: #fee2e2;
      border: 1px solid #fecaca;
    }

    body.dark-mode .error {
      color: #fff;
      background: #7f1d1d;
      border: 1px solid #fca5a5;
    }

    input[aria-invalid="true"] {
      border-color: #b91c1c;
      box-shadow: 0 0 0 4px rgba(185, 28, 28, 0.12);
    }

    body.dark-mode input[aria-invalid="true"] {
      border-color: #fca5a5;
      box-shadow: 0 0 0 4px rgba(252, 165, 165, 0.18);
    }

    .actions {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Calculadora de Huella de Carbono</h1>

    <form id="carbon-form">
      <div class="field">
        <label for="kilometros">Kilómetros en auto</label>
        <input type="number" id="kilometros" min="0" step="any" />
      </div>

      <div class="field">
        <label for="vuelo">Horas de vuelo</label>
        <input type="number" id="vuelo" min="0" step="any" />
      </div>

      <div class="field">
        <label for="electricidad">Gasto en electricidad</label>
        <input type="number" id="electricidad" min="0" step="any" />
      </div>

      <div class="actions">
        <button type="submit">Calcular</button>
        <button type="button" id="darkModeButton">Cambiar a Modo Oscuro</button>
      </div>
    </form>

    <p id="resultado" aria-live="polite" role="status"></p>
  </main>

  <script>
    const form = document.getElementById('carbon-form');
    const resultado = document.getElementById('resultado');
    const darkModeButton = document.getElementById('darkModeButton');

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      const kilometrosInput = document.getElementById('kilometros');
      const vueloInput = document.getElementById('vuelo');
      const electricidadInput = document.getElementById('electricidad');

      const kilometrosValor = kilometrosInput.value.trim();
      const vueloValor = vueloInput.value.trim();
      const electricidadValor = electricidadInput.value.trim();

      kilometrosInput.removeAttribute('aria-invalid');
      vueloInput.removeAttribute('aria-invalid');
      electricidadInput.removeAttribute('aria-invalid');

      if (kilometrosValor === '' || vueloValor === '' || electricidadValor === '') {
        resultado.textContent = 'Por favor, completa todos los campos.';
        resultado.classList.add('error');
        return;
      }

      const kilometros = Number(kilometrosValor);
      const vuelo = Number(vueloValor);
      const electricidad = Number(electricidadValor);

      const valoresValidos =
        Number.isFinite(kilometros) &&
        Number.isFinite(vuelo) &&
        Number.isFinite(electricidad);

      if (!valoresValidos) {
        resultado.textContent = 'Ingresa solo valores numéricos válidos.';
        resultado.classList.add('error');
        kilometrosInput.setAttribute('aria-invalid', 'true');
        vueloInput.setAttribute('aria-invalid', 'true');
        electricidadInput.setAttribute('aria-invalid', 'true');
        return;
      }

      const total = (kilometros + vuelo + electricidad) * 0.5;

      resultado.textContent = 'Total de Huella de Carbono en KG: ' + total;
      resultado.classList.remove('error');
    });

    darkModeButton.addEventListener('click', function () {
      document.body.classList.add('dark-mode');
    });
  </script>
</body>
</html>
